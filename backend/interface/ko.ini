[InpaintModeDescription]
STTN_AUTO = 고정 선택 영역에서 가장 빠르며 OCR을 사용하지 않습니다. 실사 영상과 고정 워터마크에 적합합니다.
STTN_DET = OCR로 타임라인을 확인하고 STTN이 마스크 내부만 복원합니다. 중국어 제거 및 대체에 적합합니다.
LAMA = 이미지, 애니메이션, 움직임이 적은 배경의 단일 프레임 복원에 강하지만 약간의 깜빡임이 생길 수 있습니다.
PROPAINTER = 강한 움직임에서 시간 일관성이 가장 좋지만 느리고 VRAM 사용량이 높습니다.
OPENCV = 가볍고 매우 빨라 마스크 미리보기에 적합하지만 복잡한 배경 품질은 AI 모델보다 낮습니다.

