[InpaintModeDescription]
STTN_AUTO = Fastest for a fixed selected area and does not run OCR. Best for live action and stationary watermarks.
STTN_DET = OCR confirms the timeline, then STTN reconstructs only masked text from neighboring frames. Best for Chinese removal and replacement.
LAMA = Strong single-frame reconstruction for images, animation, and low-motion backgrounds; temporal flicker is possible.
PROPAINTER = Best temporal consistency for strong motion; slow and demanding on VRAM.
OPENCV = Lightweight and very fast for mask previews; lower quality than AI models on complex backgrounds.

