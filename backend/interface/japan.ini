[InpaintModeDescription]
STTN_AUTO = 固定選択領域では最速でOCRを使いません。実写動画と固定透かしに最適です。
STTN_DET = OCRで時間範囲を確認し、STTNがマスク内のみ再構成します。中国語の削除と置換に最適です。
LAMA = 画像、アニメ、動きの少ない背景の単一フレーム修復に強いですが、軽いちらつきが出る場合があります。
PROPAINTER = 激しい動きで最も高い時間的一貫性を持ちますが、遅く多くのVRAMを使います。
OPENCV = 軽量で高速なマスク確認向けです。複雑な背景ではAIモデルより品質が低くなります。

