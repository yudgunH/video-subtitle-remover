[InpaintModeDescription]
STTN_AUTO = El más rápido para una zona fija y no usa OCR. Ideal para video real y marcas de agua estacionarias.
STTN_DET = OCR confirma la línea temporal y STTN reconstruye solo el texto enmascarado. Ideal para eliminar y reemplazar chino.
LAMA = Gran reconstrucción por fotograma para imágenes, animación y fondos con poco movimiento; puede producir parpadeo temporal.
PROPAINTER = La mejor consistencia temporal con movimiento fuerte; lento y exigente en VRAM.
OPENCV = Ligero y muy rápido para previsualizar máscaras; menor calidad que los modelos IA en fondos complejos.

