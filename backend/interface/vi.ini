[InpaintModeDescription]
STTN_AUTO = Nhanh nhất cho vùng cố định đã chọn; không chạy OCR. Phù hợp video người thật và watermark đứng yên.
STTN_DET = OCR xác nhận timeline rồi STTN chỉ dựng lại vùng chữ trong mask. Tối ưu cho xóa và thay thế chữ Trung.
LAMA = Dựng lại từng frame rất tốt cho ảnh, anime và nền ít chuyển động; có thể nhấp nháy nhẹ giữa các frame.
PROPAINTER = Nhất quán thời gian tốt nhất cho cảnh chuyển động mạnh; chậm và tiêu tốn nhiều VRAM.
OPENCV = Nhẹ và rất nhanh để thử mask; chất lượng thấp hơn các model AI trên nền phức tạp.

