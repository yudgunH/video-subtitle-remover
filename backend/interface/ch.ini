[InpaintModeDescription]
STTN_AUTO = 固定选区下速度最快，不运行OCR；适合真人视频和位置固定的水印。
STTN_DET = OCR确认时间轴后由STTN仅重建遮罩内文字；适合中文清除与替换。
LAMA = 单帧修复能力强，适合图片、动画和低运动背景；视频中可能出现轻微闪烁。
PROPAINTER = 强运动场景的时间一致性最好；速度慢且显存占用高。
OPENCV = 轻量、极速，适合预览遮罩；复杂背景下质量低于AI模型。

